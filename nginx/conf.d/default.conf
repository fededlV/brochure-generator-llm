# ==============================================================================
# NGINX Reverse Proxy - Virtual Host & Security Configuration
# Upstream routing, security headers, rate limiting, and SSE optimization
# ==============================================================================

upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name _;

    # Maximum request body size (mitigates memory exhaustion DoS)
    client_max_body_size 10M;

    # Restrict unneeded HTTP methods
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$) {
        return 405 "Method Not Allowed";
    }

    # ==========================================================================
    # Global Security Headers
    # Protects message exchange against sniffing, clickjacking, and XSS
    # ==========================================================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ==========================================================================
    # Health Check Endpoint
    # ==========================================================================
    location = /healthz {
        access_log off;
        return 200 "nginx-proxy-healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================================================
    # Backend API Endpoints (/api/*)
    # Includes rate limiting & Server-Sent Events (SSE) streaming optimizations
    # ==========================================================================
    location /api/ {
        # Rate limit protection (10 req/sec with burst 20 per client IP)
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        limit_req_status 429;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Forward authentic client metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Essential for Server-Sent Events (SSE) & real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # Conceal backend runtime details
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ==========================================================================
    # Interactive Backend Documentation (/docs, /redoc, /openapi.json)
    # ==========================================================================
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
    }

    # ==========================================================================
    # Frontend SPA Web Application (/)
    # ==========================================================================
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_hide_header X-Powered-By;
    }
}

