# ==============================================================================
# GitHub Actions Continuous Integration (CI) Workflow
# Automated testing, linting, frontend building, and container validation
# ==============================================================================

name: CI Pipeline

# Trigger on pushes to main or pull requests targeting main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs if a newer commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Automated Tests (FastAPI + Pytest)
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend unit and integration tests
        env:
          GEMINI_API_KEY: "AIzaSyDummyTestKeyForCIPipeline123456"
        run: |
          pytest tests/ -v

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Typecheck & Build (React + Vite + TypeScript)
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Node.js 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck and build production bundle
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker & Reverse Proxy Verification (Docker Compose)
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Build & Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build all Docker images
        env:
          GEMINI_API_KEY: "dummy_key_for_build"
        run: docker compose build

      - name: Verify NGINX reverse proxy configuration syntax
        run: |
          docker run --rm brochure-generator-proxy:latest nginx -t
